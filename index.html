<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Audio Volume Booster (up to 500%)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for sleek icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* Custom range slider styling */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            background: #334155;
            height: 8px;
            border-radius: 4px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -6px;
            background-color: #6366f1;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background-color: #818cf8;
        }

        /* Specialized boost slider glow based on level */
        .boost-slider::-webkit-slider-thumb {
            background-color: #10b981;
        }
        .boost-slider.warning::-webkit-slider-thumb {
            background-color: #f59e0b;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.7);
        }
        .boost-slider.danger::-webkit-slider-thumb {
            background-color: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.9);
        }

        /* Pulse effect for drag overlay */
        .drag-over {
            border-color: #6366f1 !important;
            background-color: rgba(99, 102, 241, 0.1) !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 md:p-8">

    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-6 sm:p-8 space-y-6 backdrop-blur-xl">
        
        <!-- Header -->
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-xl font-bold border border-indigo-500/30">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide text-white">Audio Booster</h1>
                    <p class="text-xs text-slate-400">Boost MP3 volume up to 500%</p>
                </div>
            </div>
            <div id="file-info" class="hidden sm:block text-xs font-mono text-slate-400 truncate max-w-[200px]">
                No file loaded
            </div>
        </div>

        <div id="drop-zone" class="border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-2xl p-6 text-center cursor-pointer transition-all bg-slate-950/50 group">
            <input type="file" id="audio-input" accept="audio/*" class="hidden">
            <div class="flex flex-col items-center justify-center space-y-3">
                <div class="w-12 h-12 rounded-full bg-slate-800 group-hover:bg-indigo-600/20 text-slate-400 group-hover:text-indigo-400 flex items-center justify-center text-xl transition-all">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <div>
                    <p class="text-sm font-medium text-slate-200">
                        <span class="text-indigo-400 font-semibold">Click to upload</span> or drag and drop
                    </p>
                    <p class="text-xs text-slate-500 mt-1">Supports MP3, WAV, AAC, OGG, FLAC</p>
                </div>
            </div>
        </div>

        <div class="relative bg-slate-950 rounded-2xl p-2 border border-slate-800/80 overflow-hidden group">
            <canvas id="visualizer" class="w-full h-32 sm:h-40 rounded-xl block"></canvas>
            <!-- Overlay Title on visualizer -->
            <div class="absolute top-4 left-4 pointer-events-none">
                <span id="track-name" class="text-xs font-medium text-slate-400 bg-slate-900/80 px-2.5 py-1 rounded-md border border-slate-800 backdrop-blur-sm">
                    Select an audio file to start
                </span>
            </div>
        </div>

        <div class="bg-slate-950/60 border border-slate-800/80 rounded-2xl p-5 space-y-4">
            <div class="flex items-center justify-between">
                <label for="boost-slider" class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                    <i class="fa-solid fa-volume-high text-indigo-400"></i>
                    Volume Boost
                </label>
                <div class="flex items-center gap-2">
                    <span id="boost-value" class="text-lg font-extrabold text-indigo-400 font-mono">100%</span>
                    <span id="boost-status" class="text-[10px] uppercase font-bold px-2 py-0.5 rounded text-emerald-400 bg-emerald-950/80 border border-emerald-800/50">
                        Normal
                    </span>
                </div>
            </div>

            <!-- Boost Slider -->
            <input type="range" id="boost-slider" min="0" max="500" value="100" class="boost-slider w-full">

            <div class="flex justify-between text-[11px] font-medium text-slate-500 px-1">
                <span>0% (Mute)</span>
                <span>100% (Standard)</span>
                <span>250%</span>
                <span class="text-amber-500">400%</span>
                <span class="text-rose-500 font-bold">500% (Max)</span>
            </div>
        </div>

        <div class="space-y-4">
            <!-- Timeline Seekbar & Timers -->
            <div class="space-y-1">
                <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1" class="w-full" disabled>
                <div class="flex justify-between text-xs font-mono text-slate-400">
                    <span id="current-time">00:00</span>
                    <span id="total-duration">00:00</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center justify-between pt-2">
                <!-- Left Options (Loop) -->
                <button id="btn-loop" title="Toggle Loop" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 transition flex items-center justify-center">
                    <i class="fa-solid fa-repeat"></i>
                </button>

                <!-- Center Controls (Play/Pause, Rewind, Forward) -->
                <div class="flex items-center space-x-3">
                    <button id="btn-rewind" title="Rewind 5s" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center justify-center disabled:opacity-40" disabled>
                        <i class="fa-solid fa-backward-step"></i>
                    </button>

                    <button id="btn-play" title="Play/Pause" class="w-14 h-14 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30 transition flex items-center justify-center text-xl disabled:opacity-40" disabled>
                        <i class="fa-solid fa-play ml-0.5"></i>
                    </button>

                    <button id="btn-forward" title="Forward 5s" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center justify-center disabled:opacity-40" disabled>
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                </div>

                <!-- Right Options (Mute Toggle) -->
                <button id="btn-mute" title="Mute/Unmute" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 transition flex items-center justify-center">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const dropZone = document.getElementById('drop-zone');
        const audioInput = document.getElementById('audio-input');
        const trackName = document.getElementById('track-name');
        const fileInfo = document.getElementById('file-info');

        const btnPlay = document.getElementById('btn-play');
        const btnRewind = document.getElementById('btn-rewind');
        const btnForward = document.getElementById('btn-forward');
        const btnLoop = document.getElementById('btn-loop');
        const btnMute = document.getElementById('btn-mute');

        const seekBar = document.getElementById('seek-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');

        const boostSlider = document.getElementById('boost-slider');
        const boostValue = document.getElementById('boost-value');
        const boostStatus = document.getElementById('boost-status');

        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');

        // Audio State & Web Audio API
        let audio = new Audio();
        let audioCtx = null;
        let sourceNode = null;
        let gainNode = null;
        let analyserNode = null;
        let isAudioSetup = false;
        let isMuted = false;
        let lastGainValue = 1.0;

        // Initialize Canvas Dimensions dynamically
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.parentElement.clientHeight * window.devicePixelRatio;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function setupWebAudio() {
            if (isAudioSetup) return;

            // Handle Web Audio API Cross-Browser Context Initialization
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            // Create Nodes
            sourceNode = audioCtx.createMediaElementSource(audio);
            gainNode = audioCtx.createGain();
            analyserNode = audioCtx.createAnalyser();

            // Configure Analyser
            analyserNode.fftSize = 128;

            // Connect nodes: Source -> Gain (Volume/Boost) -> Analyser -> Output
            sourceNode.connect(gainNode);
            gainNode.connect(analyserNode);
            analyserNode.connect(audioCtx.destination);

            isAudioSetup = true;
            drawVisualizer();
        }

        function handleFile(file) {
            if (!file || !file.type.startsWith('audio/')) {
                alert('Please upload a valid audio file (e.g., MP3, WAV).');
                return;
            }

            const objectUrl = URL.createObjectURL(file);
            audio.src = objectUrl;

            trackName.textContent = file.name;
            fileInfo.textContent = `${(file.size / (1024 * 1024)).toFixed(2)} MB`;

            // Enable Controls
            btnPlay.disabled = false;
            btnRewind.disabled = false;
            btnForward.disabled = false;
            seekBar.disabled = false;

            // Auto Play when file is selected
            if (!isAudioSetup) setupWebAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            audio.play().then(() => {
                updatePlayButtonIcon(true);
            }).catch(e => console.log('Autoplay blocked or waiting for user gesture:', e));
        }

        // File Input & Drag and Drop Events
        dropZone.addEventListener('click', () => audioInput.click());
        audioInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        btnPlay.addEventListener('click', () => {
            if (!isAudioSetup) setupWebAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (audio.paused) {
                audio.play();
                updatePlayButtonIcon(true);
            } else {
                audio.pause();
                updatePlayButtonIcon(false);
            }
        });

        function updatePlayButtonIcon(isPlaying) {
            btnPlay.innerHTML = isPlaying ? 
                '<i class="fa-solid fa-pause"></i>' : 
                '<i class="fa-solid fa-play ml-0.5"></i>';
        }

        btnRewind.addEventListener('click', () => {
            audio.currentTime = Math.max(0, audio.currentTime - 5);
        });

        btnForward.addEventListener('click', () => {
            audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
        });

        btnLoop.addEventListener('click', () => {
            audio.loop = !audio.loop;
            btnLoop.classList.toggle('text-indigo-400', audio.loop);
            btnLoop.classList.toggle('bg-indigo-600/20', audio.loop);
            btnLoop.classList.toggle('border', audio.loop);
            btnLoop.classList.toggle('border-indigo-500/40', audio.loop);
        });

        btnMute.addEventListener('click', () => {
            if (!gainNode) return;
            
            if (isMuted) {
                gainNode.gain.value = lastGainValue;
                btnMute.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                btnMute.classList.remove('text-rose-400');
                isMuted = false;
            } else {
                lastGainValue = gainNode.gain.value;
                gainNode.gain.value = 0;
                btnMute.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                btnMute.classList.add('text-rose-400');
                isMuted = true;
            }
        });

        // Time updates & Seeking
        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                const progress = (audio.currentTime / audio.duration) * 100;
                seekBar.value = progress;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                totalDurationEl.textContent = formatTime(audio.duration);
            }
        });

        seekBar.addEventListener('input', () => {
            if (!isNaN(audio.duration)) {
                audio.currentTime = (seekBar.value / 100) * audio.duration;
            }
        });

        audio.addEventListener('ended', () => {
            if (!audio.loop) updatePlayButtonIcon(false);
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        boostSlider.addEventListener('input', (e) => {
            const boostPercent = parseInt(e.target.value, 10);
            const gainMultiplier = boostPercent / 100;

            // Display text update
            boostValue.textContent = `${boostPercent}%`;

            // Adjust GainNode in Web Audio API (Can go above 1.0 up to 5.0 for 500%)
            if (gainNode) {
                gainNode.gain.value = gainMultiplier;
            }

            // Style state indicator based on boost strength
            boostSlider.classList.remove('warning', 'danger');
            boostStatus.className = "text-[10px] uppercase font-bold px-2 py-0.5 rounded border";

            if (boostPercent <= 100) {
                boostStatus.textContent = boostPercent === 0 ? "Muted" : "Normal";
                boostStatus.classList.add('text-emerald-400', 'bg-emerald-950/80', 'border-emerald-800/50');
            } else if (boostPercent <= 250) {
                boostStatus.textContent = "Boosted";
                boostStatus.classList.add('text-indigo-400', 'bg-indigo-950/80', 'border-indigo-800/50');
            } else if (boostPercent <= 400) {
                boostSlider.classList.add('warning');
                boostStatus.textContent = "High Boost";
                boostStatus.classList.add('text-amber-400', 'bg-amber-950/80', 'border-amber-800/50');
            } else {
                boostSlider.classList.add('danger');
                boostStatus.textContent = "Extreme Overdrive";
                boostStatus.classList.add('text-rose-400', 'bg-rose-950/80', 'border-rose-800/50');
            }

            if (isMuted && boostPercent > 0) {
                isMuted = false;
                btnMute.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                btnMute.classList.remove('text-rose-400');
            }
        });

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);

            const width = canvas.width;
            const height = canvas.height;

            canvasCtx.clearRect(0, 0, width, height);

            if (!analyserNode) return;

            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyserNode.getByteFrequencyData(dataArray);

            const barWidth = (width / bufferLength) * 2.2;
            let barHeight;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                barHeight = (dataArray[i] / 255) * height * 0.85;

                // Color gradient depending on amplification level
                const boost = parseInt(boostSlider.value, 10);
                let gradient = canvasCtx.createLinearGradient(0, height, 0, 0);

                if (boost > 350) {
                    gradient.addColorStop(0, '#6366f1');
                    gradient.addColorStop(0.6, '#f59e0b');
                    gradient.addColorStop(1, '#ef4444');
                } else if (boost > 100) {
                    gradient.addColorStop(0, '#4f46e5');
                    gradient.addColorStop(0.7, '#818cf8');
                    gradient.addColorStop(1, '#38bdf8');
                } else {
                    gradient.addColorStop(0, '#312e81');
                    gradient.addColorStop(1, '#6366f1');
                }

                canvasCtx.fillStyle = gradient;
                
                // Draw rounded top bars
                canvasCtx.beginPath();
                canvasCtx.roundRect(x, height - barHeight, barWidth - 2, barHeight, [4, 4, 0, 0]);
                canvasCtx.fill();

                x += barWidth;
            }
        }

        // Draw initial static state for aesthetic background before playback
        function drawIdleCanvas() {
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
            canvasCtx.fillStyle = '#1e293b';
            const bars = 40;
            const barWidth = canvas.width / bars;
            for (let i = 0; i < bars; i++) {
                const h = Math.sin(i * 0.3) * 15 + 20;
                canvasCtx.beginPath();
                canvasCtx.roundRect(i * barWidth, canvas.height - h, barWidth - 4, h, [4, 4, 0, 0]);
                canvasCtx.fill();
            }
        }
        drawIdleCanvas();
    </script>
</body>
</html>
